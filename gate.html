<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Yükleniyor...</title>
<style>body{margin:0;background:#111;display:flex;align-items:center;justify-content:center;height:100vh;}
.sp{width:40px;height:40px;border:4px solid #333;border-top-color:#fff;border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}</style>
</head>
<body>
<div class="sp"></div>
<script>
(function(){
  var valid = ['tg','fb','ig','tt'];
  var hash = (location.hash||'').replace('#','').toLowerCase().trim();
  if(valid.indexOf(hash)!==-1){
    document.cookie='_src=1; path=/; max-age=604800; samesite=lax';
  }
  // Token olsa da olmasa da index'e git, bot tespiti orada yapılıyor
  location.replace('/index.html');
})();
</script>
</body>
</html>
